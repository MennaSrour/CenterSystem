name: Desktop CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Style, unit tests, and desktop build
        run: ./gradlew.bat ktlintCheck allTests :desktopApp:desktopJar --no-daemon
      - name: Windows installers
        run: ./gradlew.bat :desktopApp:packageMsi :desktopApp:packageExe --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installers
          path: desktopApp/build/compose/binaries/main/
          if-no-files-found: error
