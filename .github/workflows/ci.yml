name: Desktop CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Style, unit tests, and desktop build
        run: ./gradlew.bat ktlintCheck allTests :desktopApp:desktopJar --no-daemon
      - name: Configure preinstalled WiX 3
        shell: pwsh
        run: |
          $candidates = @()
          if ($env:WIX) {
            $candidates += $env:WIX
            $candidates += Join-Path $env:WIX 'bin'
          }
          $candidates += Get-ChildItem "${env:ProgramFiles(x86)}\WiX Toolset v3*" -Directory |
            ForEach-Object { Join-Path $_.FullName 'bin' }
          $candle = Get-Command candle.exe -ErrorAction SilentlyContinue
          if ($candle) { $candidates += Split-Path $candle.Source }
          $wix = $candidates | Where-Object {
            (Test-Path (Join-Path $_ 'candle.exe')) -and
            (Test-Path (Join-Path $_ 'light.exe'))
          } | Select-Object -First 1
          if (-not $wix) {
            throw 'WiX 3 candle.exe and light.exe were not found on the runner.'
          }
          "WIX_PATH=$wix" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Using preinstalled WiX: $wix"
      - name: Windows installers
        run: ./gradlew.bat :desktopApp:packageMsi :desktopApp:packageExe --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installers
          path: desktopApp/build/compose/binaries/main/
          if-no-files-found: error
